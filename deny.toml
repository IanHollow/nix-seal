[advisories]
version = 2
yanked = "deny"
# age's optional OpenSSH compatibility feature requires `rsa` for parsing
# existing OpenSSH RSA identities. RUSTSEC-2023-0071 has no upstream fix. Its
# use is constrained by ADR 0009: no network service, no daemon, no RSA for
# new configuration, and no encrypted-key prompting. Reassess on every age or
# rsa update and remove this exception before any network-facing use exists.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
