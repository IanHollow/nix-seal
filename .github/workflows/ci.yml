name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  legacy-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject removed manager symbols and runtime references
        run: |
          if git grep -nEi 'secret[c]tl|secret[I]ndex|config[.]age[.]secrets|inputs[.]agenix'; then
            echo 'removed secret-manager symbols or agenix runtime references found' >&2
            exit 1
          fi
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: "1.93.0"
      - run: cargo check --workspace --all-targets --locked
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - run: nix flake check --print-build-logs
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0
      - name: Install cargo-vet
        run: cargo install --locked --version 0.10.2 cargo-vet
      - run: cargo vet --locked
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0
      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit
      # RustCrypto RSA is retained only for the documented OpenSSH migration
      # compatibility path; see ADR 0009 for the compensating controls and
      # explicit pre-1.0 release-blocker status.
      - run: cargo audit --ignore RUSTSEC-2023-0071
  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      # The repository's stable rust-toolchain file otherwise overrides the
      # nightly selected below when cargo-fuzz starts rustc with -Z flags.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install --locked --version 0.13.2 cargo-fuzz
      - name: Fuzz strict public plan parsing
        working-directory: fuzz
        run: cargo fuzz run plan-v1 -- -max_total_time=60
      - name: Fuzz strict public activation parsing
        working-directory: fuzz
        run: cargo fuzz run activation-v2 -- -max_total_time=60
      - name: Fuzz strict public template parsing
        working-directory: fuzz
        run: cargo fuzz run template-v1 -- -max_total_time=60
      - name: Fuzz strict public artifact-envelope parsing
        working-directory: fuzz
        run: cargo fuzz run artifact-envelope-v1 -- -max_total_time=60
      - name: Fuzz recipient and identity parsing
        working-directory: fuzz
        run: cargo fuzz run identity-v1 -- -max_total_time=60
      - name: Fuzz transactional cache state
        working-directory: fuzz
        run: cargo fuzz run cache-state-v1 -- -max_total_time=60
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.97.0
      - name: Record runner metadata
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "kernel=$(uname -a)"
            echo "rust=$(rustc --version --verbose)"
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo || true)"
          } > benchmark-environment.txt
      - name: Run scale benchmark
        run: cargo bench -p nix-seal-policy --bench scale --locked > benchmark.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nix-seal-benchmarks-${{ github.sha }}
          path: |
            benchmark.jsonl
            benchmark-environment.txt
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
