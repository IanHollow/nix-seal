name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
permissions: {}
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  legacy-symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject removed manager symbols and runtime references
        run: |
          if git grep -nEi 'secret[c]tl|secret[I]ndex|config[.]age[.]secrets|inputs[.]agenix'; then
            echo 'removed secret-manager symbols or agenix runtime references found' >&2
            exit 1
          fi
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.93.0"
      - run: cargo check --workspace --all-targets --locked
  nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Materialize partition source
        run: nix store add-path flake/dev
      - run: nix flake check --keep-going --show-trace --print-build-logs --system "${{ matrix.system }}"
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Materialize partition source
        run: nix store add-path flake/dev
      - run: nix develop --command prek run --all-files
      - run: nix develop --command gitleaks detect --source . --redact --baseline-path=.gitleaks-baseline.json
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.0
      - name: Install cargo-vet
        run: cargo install --locked --version 0.10.2 cargo-vet
      - run: cargo vet --locked
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.0
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Materialize partition source
        run: nix store add-path flake/dev
      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit
      # RustCrypto RSA is retained only for the documented OpenSSH migration
      # compatibility path; see ADR 0009 for the compensating controls and
      # explicit pre-1.0 release-blocker status.
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Scan all supported lockfiles
        run: nix develop --command osv-scanner scan source --recursive --config osv-scanner.toml .
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The repository's stable rust-toolchain file otherwise overrides the
      # nightly selected below when cargo-fuzz starts rustc with -Z flags.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install --locked --version 0.13.2 cargo-fuzz
      - name: Fuzz strict public plan parsing
        working-directory: fuzz
        run: cargo fuzz run plan-v2 -- -max_total_time=60
      - name: Fuzz strict public activation parsing
        working-directory: fuzz
        run: cargo fuzz run activation-v2 -- -max_total_time=60
      - name: Fuzz strict public template parsing
        working-directory: fuzz
        run: cargo fuzz run template-v1 -- -max_total_time=60
      - name: Fuzz strict public artifact-envelope parsing
        working-directory: fuzz
        run: cargo fuzz run artifact-envelope-v1 -- -max_total_time=60
      - name: Fuzz recipient and identity parsing
        working-directory: fuzz
        run: cargo fuzz run identity-v1 -- -max_total_time=60
      - name: Fuzz transactional cache state
        working-directory: fuzz
        run: cargo fuzz run cache-state-v1 -- -max_total_time=60
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.0
      - name: Record runner metadata
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "kernel=$(uname -a)"
            echo "rust=$(rustc --version --verbose)"
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo || true)"
          } > benchmark-environment.txt
      - name: Run scale benchmark
        run: cargo bench -p nix-seal-policy --bench scale --locked > benchmark.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-seal-benchmarks-${{ github.sha }}
          path: |
            benchmark.jsonl
            benchmark-environment.txt
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
