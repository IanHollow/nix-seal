name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions: {}
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-latest
            system: x86_64-linux
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            system: aarch64-linux
          - name: aarch64-darwin
            runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build the reproducible Nix package
        run: nix build --print-build-logs ".#packages.${{ matrix.system }}.nix-seal"
      - name: Stage executable
        run: |
          mkdir -p dist
          cp result/bin/nix-seal "dist/nix-seal-${{ matrix.name }}"
          chmod 0755 "dist/nix-seal-${{ matrix.name }}"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: result
          format: cyclonedx-json
          output-file: "dist/nix-seal-${{ matrix.name }}.cdx.json"
      - name: Record checksums and build metadata
        run: |
          sha256sum dist/* > "dist/nix-seal-${{ matrix.name }}.sha256"
          {
            echo "commit=${GITHUB_SHA}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "system=${{ matrix.system }}"
            echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
            echo "rust-toolchain=$(test -f rust-toolchain.toml && sed -n 's/^channel = \"\(.*\)\"$/\1/p' rust-toolchain.toml || true)"
          } > "dist/nix-seal-${{ matrix.name }}.build-info"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nix-seal-release-${{ matrix.name }}
          path: dist
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nix-seal-release-*
          path: dist
          merge-multiple: true
      - name: Verify release inputs
        run: |
          set -euo pipefail
          test -n "${GITHUB_REF_NAME}"
          test -n "$(find dist -type f -name 'nix-seal-*' -not -name '*.cdx.json' -not -name '*.sha256' -not -name '*.build-info' | head -n1)"
          sha256sum -c dist/*.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/nix-seal-*
      - name: Publish signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "nix-seal ${GITHUB_REF_NAME}"
