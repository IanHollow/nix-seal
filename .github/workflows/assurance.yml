name: Assurance
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 6"
permissions: {}
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  miri:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly
          components: miri, rust-src
      - name: Run Miri on the memory-safe core
        run: cargo miri test -p nix-seal-core --lib
  address-sanitizer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly
          components: rust-src
      - name: Run address sanitizer on the parser core
        run: cargo test -p nix-seal-core --lib -Zbuild-std --target x86_64-unknown-linux-gnu
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.0
      - name: Install cargo-mutants
        run: cargo install --locked --version 27.1.0 cargo-mutants
      - name: Mutate policy and core crates
        run: cargo mutants --package nix-seal-core --package nix-seal-policy --timeout 120 --jobs 2
