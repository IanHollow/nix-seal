[workspace]
resolver = "2"
members = [
  "crates/nix-seal-authoring",
  "crates/nix-seal-cache",
  "crates/nix-seal-cli",
  "crates/nix-seal-core",
  "crates/nix-seal-crypto",
  "crates/nix-seal-manifest",
  "crates/nix-seal-policy",
  "crates/nix-seal-rekey",
  "crates/nix-seal-runtime",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.93"
authors = ["Ian Hollow"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/IanHollow/nix-seal"

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false, features = ["armor", "plugin", "ssh"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash"] }
anyhow = "1.0.98"
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
bech32 = "=0.11.1"
blake3 = "1.8.2"
clap = { version = "4.5.40", features = ["derive"] }
clap_complete = "4.5.54"
clap_complete_nushell = "4.6.1"
fs2 = "0.4.3"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "=0.4.3"
jiff = { version = "=0.2.35", default-features = false, features = ["std"] }
nix-seal-authoring = { path = "crates/nix-seal-authoring", version = "=0.1.0-alpha.1" }
nix-seal-cache = { path = "crates/nix-seal-cache", version = "=0.1.0-alpha.1" }
nix-seal-core = { path = "crates/nix-seal-core", version = "=0.1.0-alpha.1" }
nix-seal-crypto = { path = "crates/nix-seal-crypto", version = "=0.1.0-alpha.1" }
nix-seal-manifest = { path = "crates/nix-seal-manifest", version = "=0.1.0-alpha.1" }
nix-seal-policy = { path = "crates/nix-seal-policy", version = "=0.1.0-alpha.1" }
nix-seal-rekey = { path = "crates/nix-seal-rekey", version = "=0.1.0-alpha.1" }
nix-seal-runtime = { path = "crates/nix-seal-runtime", version = "=0.1.0-alpha.1" }
rustix = { version = "=1.1.4", features = ["fs", "process", "termios", "thread"] }
schemars = "1.0.4"
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_jcs = "0.1.0"
sha2 = "=0.10.9"
ssh-key = { version = "=0.6.7", default-features = false, features = ["alloc", "ed25519"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
toml = "0.9.2"
yaml_serde = "=0.10.4"
uzers = { version = "=0.12.2", default-features = false }
zeroize = "=1.9.0"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true
panic = "abort"
