schema = "nix-seal.plan.v1"

[identities.admin]
kind = "administrator"
public = "age1replace-with-a-public-recipient"

[identities.server]
kind = "target"
public = "age1replace-with-a-public-recipient"

[identities.release]
kind = "signer"
public = "nix-seal-ed25519-v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

[targets.server]
kind = "nixOs"
system = "x86_64-linux"
identity = "server"

[secrets."services/example/token"]
source = "secrets/services/example/token.age"
consumers = ["server"]
administrators = ["admin"]

[templates."services/example/config"]
source = "templates/services/example.conf"

[templates."services/example/config".placeholders.token]
secret = "services/example/token"
encoding = "utf8"
